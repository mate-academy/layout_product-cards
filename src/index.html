<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:wdth,wght@75..100,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <article
      class="product-card"
      data-qa="card"
    >
      <div class="product-card__image">
        <img
          src="./images/imac.jpeg"
          alt="APPLE A1419 iMac 27'' Retina 5K Monoblock"
          class="product-card__img"
        />
      </div>
      <h2 class="product-card__title">
        APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
      </h2>
      <p class="product-card__code">Product code: 195434</p>
      <div class="product-card__rating-block">
        <div class="stars stars--4 product-card__stars">
          <span class="stars__star"></span>
          <span class="stars__star"></span>
          <span class="stars__star"></span>
          <span class="stars__star"></span>
          <span class="stars__star"></span>
        </div>
        <p class="product-card__reviews">Reviews: 5</p>
      </div>
      <div class="product-card__price-block">
        <span class="product-card__price-label">Price:</span>
        <data class="product-card__price">$2,199</data>
      </div>
      <a
        class="product-card__buy-btn"
        href="#"
        data-qa="hover"
      >
        BUY
      </a>
    </article>
  </body>
</html>
