<!-- #region head -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <!-- #endregion -->
  <body class="page">
    <main class="page__main">
      <h1 class="page__title visually-hidden">Product cards</h1>

      <section
        class="card"
        data-qa="card"
      >
        <h2 class="card__heading">
          APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
        </h2>

        <p class="card__product-code">Product code: 195434</p>

        <section class="card__reviews">
          <h3 class="visually-hidden">Reviews</h3>

          <ul class="stars stars--4">
            <li class="stars__star"></li>
            <li class="stars__star"></li>
            <li class="stars__star"></li>
            <li class="stars__star"></li>
            <li class="stars__star"></li>
          </ul>

          <p class="card__reviews-number">Reviews: 5</p>
        </section>

        <section class="card__price">
          <h3 class="visually-hidden">Price</h3>

          <p class="card__price-label">Price:</p>
          <p class="card__price-sum">$2,199</p>
        </section>

        <a
          href="#"
          class="card__button"
          data-qa="hover"
        >
          Buy
        </a>
      </section>
    </main>
  </body>
</html>
