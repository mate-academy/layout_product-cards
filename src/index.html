<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header class="header"></header>
    <main class="main">
      <div
        class="card"
        data-qa="card"
      >
        <a
          class="card__link-img"
          href="#"
        >
          <img
            class="card__img"
            src="./images/imac.jpeg"
            alt="Apple iMac 27 Retina 5K Monobloc"
          />
        </a>
        <div class="card__content">
          <h3 class="card__title">
            <a
              class="card__link-title"
              href="#"
            >
              APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
            </a>
          </h3>
          <span class="card__code">Product code: 195434</span>
          <div class="card__raiting">
            <div class="stars stars--4">
              <div class="stars__star"></div>
              <div class="stars__star"></div>
              <div class="stars__star"></div>
              <div class="stars__star"></div>
              <div class="stars__star"></div>
            </div>
            <span class="card__reviews">Reviews: 5</span>
          </div>
          <div class="card__price">
            <div class="card__price-title">Price:</div>
            <div class="card__price-num">$2,199</div>
          </div>
        </div>
        <div class="card__button">
          <a
            class="button"
            data-qa="hover"
            href="#"
          >
            Buy
          </a>
        </div>
      </div>
    </main>
    <footer class="footer"></footer>
  </body>
</html>
