<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <!-- <title>Product cards</title> -->
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <!-- <h1>Product cards</h1> -->

  <body>
    <div
      class="product-card"
      data-qa="card"
    >
      <div class="product-card__image"></div>

      <div class="product-card__info">
        <h1 class="product-card__title">
          APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
        </h1>

        <p class="product-card__code">Product code: 195434</p>
      </div>

      <div class="product-card__reviews">
        <div class="product-card__stars">
          <div class="product-card__star product-card__star--filled"></div>
          <div class="product-card__star product-card__star--filled"></div>
          <div class="product-card__star product-card__star--filled"></div>
          <div class="product-card__star product-card__star--filled"></div>
          <div class="product-card__star"></div>
        </div>
        <p class="product-card__reviews-text">Reviews: 5</p>
      </div>

      <div class="product-card__price">
        <p class="product-card__price-text">Price:</p>
        <p class="product-card__price-value">$2,199</p>
      </div>

      <div
        class="product-card__buy"
        data-qa="hover"
      >
        <a
          class="product-card__buy-text"
          data-qa="hover"
        >
          buy
        </a>
      </div>
    </div>
  </body>
</html>
