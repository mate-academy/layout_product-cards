<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <!-- <h1>Product cards</h1> -->

  <body>
    <div
      class="product-card"
      data-qa="card"
    >
      <div class="product-card__image-container">
        <img
          class="product-card__image"
          src="images/imac.jpeg"
          alt="product"
        />
      </div>

      <div class="product-card__info">
        <h1 class="product-card__title">
          APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
        </h1>

        <p class="product-card__code">Product code: 195434</p>
      </div>

      <div class="product-card__reviews">
        <div class="stars product-card__stars">
          <div class="stars__star stars__star--1"></div>
          <div class="stars__star stars__star--2"></div>
          <div class="stars__star stars__star--3"></div>
          <div class="stars__star stars__star--4"></div>
          <div class="stars__star stars__star--5"></div>
        </div>
        <p class="product-card__reviews-text">Reviews: 5</p>
      </div>

      <div class="product-card__price">
        <p class="product-card__price-text">Price:</p>
        <p class="product-card__price-value">$2,199</p>
      </div>

      <div class="product-card__buy">
        <a
          class="product-card__buy-text"
          data-qa="hover"
        >
          buy
        </a>
      </div>
    </div>
  </body>
</html>
