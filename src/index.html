<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wdth,wght@75..100,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./styles/reset.css"
    />
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <body>
    <article
      class="product-card"
      data-qa="card"
    >
      <img
        src="./images/imac.jpeg"
        alt="Imac"
        class="product-card__img"
      />
      <ul class="product-card__list">
        <li class="product-card__item">
          <h2 class="product-card__name">
            APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
          </h2>
        </li>
        <li class="product-card__item">
          <p class="product-card__code">Product code: 195434</p>
        </li>
      </ul>

      <div class="product-card__rating">
        <div class="stars stars--4">
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
        </div>

        <p class="product-card__reviews">Reviews: 5</p>
      </div>

      <div class="product-card__price">
        <p class="product-card__title">Price:</p>
        <p class="product-card__value">$2,199</p>
      </div>

      <button
        type="button"
        href="#"
        class="product-card__button"
        data-qa="hover"
      >
        BUY
      </button>
    </article>
  </body>
</html>
