<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <body>
    <div
      class="card"
      data-qa="card"
    >
      <img
        src="./images/imac.jpeg"
        alt="IMac photo"
        class="card__photo"
      />

      <div class="card__ProductName">
        <h2 class="card__H2">
          APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
        </h2>
      </div>

      <div class="card__productCode">
        <h2 class="card__h2ProdCode">Product code: 195434</h2>
      </div>

      <div class="review">
        <div class="stars stars--4">
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
        </div>

        <div class="review__block">
          <h2 class="review__text">Reviews: 5</h2>
        </div>
      </div>

      <div class="price">
        <div class="price__block">
          <h2 class="price__text">Price:</h2>
        </div>
        <div class="price__block">
          <h2 class="price__number">$2,199</h2>
        </div>
      </div>
      

      <button class="button">
        <a
          href="#"
          data-qa="hover"
          class="button__link"
        >
          buy
        </a>
      </button>
    </div>
  </body>
</html>
