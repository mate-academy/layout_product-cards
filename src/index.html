<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wdth,wght@0,75..100,100..900;1,75..100,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <body>
    <div
      data-qa="card"
      class="card"
    >
      <div class="card__image"></div>
      <div class="card__text">
        <p class="card__title">
          APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
        </p>
      </div>
      <div class="card__product-code">
        <p class="card__code">Product code: 195434</p>
      </div>
      <div class="card__reviews">
        <div class="card__stars card__stars--active">
          <div class="card__star"></div>
          <div class="card__star"></div>
          <div class="card__star"></div>
          <div class="card__star"></div>
          <div class="card__star"></div>
        </div>
        <div class="card__reviews-text">
          <p class="card__reviews-text">Reviews: 5</p>
        </div>
      </div>
      <div class="card__pricebox">
        <p class="card__price-text">Price:</p>
        <p class="card__price">$2,199</p>
      </div>
      <div
        data-qa="hover"
        class="card__buy-button"
      >
        <a
          href="#"
          class="card__link"
        >
          BUY
        </a>
      </div>
    </div>
  </body>
</html>
