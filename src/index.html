<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="card" data-qa="card">
      <div class="card__image"></div>

      <div class="card__title">
        APPLE A1419 iMac 27" Retina 5K
      </div>

      <span class="card__product_code">
        Product code: 195434
      </span>

      <div class="card__reviews">
        <div class="stars stars--4">
          <div class="star"></div>
          <div class="star"></div>
          <div class="star"></div>
          <div class="star"></div>
          <div class="star"></div>
        </div>
        <span class="card__reviews_number">5 Reviews</span>
      </div>

      <div class="card__price">
        <span class="card__price_label">Price:</span>
        <span class="card__price_value">$2,199</span>
      </div>

      <a href="#" class="card__button_buy">BUY</a>
    </div>

  </body>
</html>
