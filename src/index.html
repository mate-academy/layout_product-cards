<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div
      class="product-card"
      data-qa="card"
    >
      <div class="product-card__img">
        <img
          src="../src/images/imac.jpeg"
          alt="APPLE A1419 iMac 27 Retina 5K Monoblock"
          class="product-card__img-tag"
        />
      </div>

      <section class="product-card__title">
        <p class="product-card__title-text">
          APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
        </p>
      </section>

      <section class="product-card__code">
        <p class="product-card__code-text">Product code: 195434</p>
      </section>

      <section class="product-card__stars">
        <div class="stars stars--4">
          <div class="stars__board">
            <span class="stars__star"></span>
            <span class="stars__star"></span>
            <span class="stars__star"></span>
            <span class="stars__star"></span>
            <span class="stars__star"></span>
          </div>
          <div class="stars__review">
            <p class="review">Reviews: 5</p>
          </div>
        </div>
      </section>

      <section class="product-card__price">
        <span class="product-card__price-label">Price:</span>
        <span class="product-card__value">$2,199</span>
      </section>

      <section class="product-card__button">
        <a
          class="product-card__button-text"
          data-qa="hover"
          href="#"
        >
          Buy
        </a>
      </section>
    </div>
  </body>
</html>
