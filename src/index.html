<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div
      class="card"
      data-qa="card"
    >
      <div class="card_image"></div>
      <div class="card_top">
        <div class="card_info">
          <div class="card_name">
            APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
          </div>

          <div class="card_code">Product code: 195434</div>
        </div>
      </div>

      <div class="card_reviews">
        <ul class="card_reviews_list">
          <li class="card_reviews_star"></li>
          <li class="card_reviews_star"></li>
          <li class="card_reviews_star"></li>
          <li class="card_reviews_star"></li>
          <li class="card_reviews_star"></li>
        </ul>

        <div class="card_reviews_content">Reviews: 5</div>
      </div>

      <div class="card_footer">
        <div class="card_price">
          <div class="card_price-text">Price:</div>

          <div class="card_price-value">$2,199</div>
        </div>
        <button
          type="button"
          class="card_button"
          data-qa="hover"
        >
          Buy
        </button>
      </div>
    </div>
  </body>
</html>
