<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div
      data-qa="card"
      class="product-card"
    >
      <img
        src="/src/images/imac.jpeg"
        alt="iMac product card"
        class="product-card__image"
      />

      <div class="product-card__info">
        <a
          href="#"
          class="product-card__name"
        >
          APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
        </a>

        <p class="product-card__code">Product code: 195434</p>

        <div class="product-card__reviews">
          <div class="product-card__stars">
            <div class="stars stars--4">
              <div class="stars__star"></div>
              <div class="stars__star"></div>
              <div class="stars__star"></div>
              <div class="stars__star"></div>
              <div class="stars__star"></div>
            </div>
          </div>
          <span class="product-card__reviews-count">Reviews: 5</span>
        </div>
        <div class="product-card__price">
          <span class="product-card__price-label">Price:</span>
          <span class="product-card__price-value">$2,199</span>
        </div>
        <a
          href="#"
          data-qa="hover"
          class="product-card__cta-button product-card__cta-button--hover"
        >
          Buy
        </a>
      </div>
    </div>
  </body>
</html>
