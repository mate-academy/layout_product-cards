<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <article
      class="card"
      data-qa="card"
    >
      <div class="card__image"></div>
      <div class="card__content">
        <h2 class="card__title">
          APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
        </h2>
        <p class="card__code">Product code: 195434</p>
        <div class="card__footer">
          <div class="stars stars--4">
            <ul class="stars__list">
              <li class="stars__list-item"></li>
              <li class="stars__list-item"></li>
              <li class="stars__list-item"></li>
              <li class="stars__list-item"></li>
              <li class="stars__list-item"></li>
            </ul>
            <span class="stars__reviews">Reviews: 5</span>
          </div>
          <div class="card__price">
            <span class="card__price-label">Price:</span>
            <span class="card__price-value">$2,199</span>
          </div>
          <button
            class="card__buy-button"
            data-qa="hover"
          >
            BUY
          </button>
        </div>
      </div>
    </article>
  </body>
</html>
