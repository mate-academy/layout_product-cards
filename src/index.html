<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="page">
      <div
        class="card"
        data-qa="card"
      >
        <div class="card__images">
          <img
            src="images/imac.jpeg"
            alt="imac-photo"
          />
        </div>

        <div class="card__title">
          APPLE A1419 iMac 27" Retina
          <br />
          5K Monoblock (MNED2UA/A)
        </div>

        <div class="card__information">Product code: 195434</div>

        <div class="card__reviews">
          <div class="stars stars--4">
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
          </div>
          <div class="card__reviews-numbers">Reviews: 5</div>
        </div>

        <div class="card__price">
          <div class="card__price-text">Price:</div>
          <div class="card__price-sum">$2,199</div>
        </div>
        <a
          data-qa="hover"
          class="card__button"
          href="#"
        >
          BUY
        </a>
      </div>
    </div>
  </body>
</html>
