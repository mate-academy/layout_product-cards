<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
    <link
      rel="stylesheet"
      href="./styles//card.scss"
    />
    <link
      rel="stylesheet"
      href="./styles/stars.scss"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <section
        data-qa="card"
        class="card"
      >
        <div class="card__item"></div>
        <h3 class="card__name">
          APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
        </h3>
        <p class="card__code">Product code: 195434</p>
        <div class="review">
          <div class="review__rating">
            <p class="review__star review__star--active"></p>
            <p class="review__star review__star--active"></p>
            <p class="review__star review__star--active"></p>
            <p class="review__star review__star--active"></p>
            <p class="review__star review__star--inactive"></p>
          </div>
          <p class="review__info">Reviews: 5</p>
        </div>
        <div class="card__sell">
          <p class="card__info">Price:</p>
          <p class="card__price">$2,199</p>
        </div>
        <button
          data-qa="hover"
          class="card__buy_button"
        >
          BUY
        </button>
      </section>
    </div>
  </body>
</html>
