<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
    <link
      rel="stylesheet"
      href="./styles/card.scss"
    />
    <link
      rel="stylesheet"
      href="./styles/stars.scss"
    />
  </head>

  <body>
    <a
      href="#"
      class="card"
      data-qa="card"
    >
      <img
        class="card__image"
        src="./images/imac.jpeg"
        alt="iMac"
      />

      <p class="card__title">
        APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
      </p>

      <p class="card__productCode">Product code: 195434</p>

      <div class="stars">
        <div class="stars__stars stars__stars--4">
          <span class="stars__star"></span>
          <span class="stars__star"></span>
          <span class="stars__star"></span>
          <span class="stars__star"></span>
          <span class="stars__star"></span>
        </div>
        <span class="stars__count">Reviews: 5</span>
      </div>

      <div class="card__price">
        <span class="card__price__text">Price:</span>
        <span class="card__price__value">$2,199</span>
      </div>

      <div
        class="card__button"
        data-qa="hover"
      >
        Buy
      </div>
    </a>
  </body>
</html>
