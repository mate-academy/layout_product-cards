<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <body>
    <div
      class="card"
      data-qa="card"
    >
      <img
        src="./images/imac.jpeg"
        class="imac_card"
        alt="photo"
      />
      <div class="product_info">
        <div class="title_rew">
          <h2 class="title">
            APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
          </h2>

          <div class="product_code">Product code: 195434</div>
        </div>
        <div class="product_rew">
          <div class="product_reviews">Reviews: 5</div>

          <div class="stars stars--0">
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
          </div>
        </div>

        <div class="card_product">
          <div class="price">Price:</div>
          <h1 class="card_price">$2,199</h1>
        </div>
      </div>
      <div class="product_cartbuy">
        <a
          href="#"
          data-qa="hover"
          class="product_buy"
        >
          buy
        </a>
      </div>
    </div>
  </body>
</html>
