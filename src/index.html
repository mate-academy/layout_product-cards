<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div
      class="card"
      data-qa="card"
    >
      <div class="card__img"></div>

      <div class="card__title">
        <h1 class="card__title-text">
          APPLE A1419 iMac 27" Retina
          <br />
          5K (MNED2UA/A)
        </h1>
      </div>

      <div class="card__code">
        <h2 class="card__code-text">Product code: 195434</h2>
      </div>

      <div class="card__reviews">
        <div class="card__stars card__stars--4">
          <div class="card__stars-star"></div>
          <div class="card__stars-star"></div>
          <div class="card__stars-star"></div>
          <div class="card__stars-star"></div>
          <div class="card__stars-star"></div>
        </div>
        <div class="card__response">
          <h2 class="card__response-text">Reviews: 5</h2>
        </div>
      </div>

      <div class="card__price">
        <div class="card__price-text">
          <h2 class="card__price-text-left">Price:</h2>
        </div>
        <div class="card__price-cost">
          <h2 class="card__price-cost-right">$2,199</h2>
        </div>
      </div>

      <div class="card__button">
        <a
          href="#"
          data-qa="hover"
        >
          <button class="card__button-text">BUY</button>
        </a>
      </div>
    </div>
  </body>
</html>
