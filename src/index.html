<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- 1. O card principal agora engloba todo o conteúdo -->
    <article
      class="card"
      data-qa="card"
    >
      <img
        class="card__image"
        src="./images/imac.jpeg"
        alt="iMac A1419"
      />

      <!-- 2. Classes simplificadas seguindo o padrão BEM -->
      <h1 class="card__title">
        APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
      </h1>
      <p class="card__code">Product code: 195434</p>

      <!-- 3. Contêiner para estrelas e o texto de reviews -->
      <div class="card__reviews">
        <div class="stars stars--4">
          <!-- 4. As 5 estrelas precisam existir no HTML para o CSS funcionar -->
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
        </div>
        <span class="card__reviews-text">Reviews: 5</span>
      </div>

      <div class="card__price-wrapper">
        <span class="card__price-label">Price:</span>
        <span class="card__price-value">$2,199</span>
      </div>

      <!-- 5. O botão precisa ser uma tag de link (a) com o atributo de teste -->
      <a
        href="#"
        class="card__button"
        data-qa="hover"
      >
        BUY
      </a>
    </article>
  </body>
</html>
