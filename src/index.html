<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Roboto:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./styles/variables.scss"
    />
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
    <link
      rel="stylesheet"
      href="./styles/productCard.scss"
    />
  </head>
  <body>
    <div
      class="productCard"
      data-qa="card"
    >
      <div class="productCard__image"></div>

      <div class="productCard__details">
        <p class="productCard__details productCard__details--name">
          APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
        </p>
        <p class="productCard__details productCard__details--code">
          Product code: 195434
        </p>
      </div>

      <div class="productCard__raitingContainer">
        <div class="productCard__ratingStars">
          <div
            class="productCard__ratingStars productCard__ratingStars--star"
          ></div>
          <div
            class="productCard__ratingStars productCard__ratingStars--star"
          ></div>
          <div
            class="productCard__ratingStars productCard__ratingStars--star"
          ></div>
          <div
            class="productCard__ratingStars productCard__ratingStars--star"
          ></div>
          <div
            class="productCard__ratingStars productCard__ratingStars--star"
          ></div>
        </div>

        <p class="productCard__reviews">Reviews: 5</p>
      </div>

      <div class="productCard__price">
        <p class="productCard__price
        productCard__price--price">
        Price:
        </p>
        <p class="productCard__price
        productCard__price--value">
        $2,199
        </p>
      </div>

      <div class="productCard__button">Buy</div>
    </div>
  </body>
</html>
