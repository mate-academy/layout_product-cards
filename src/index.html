<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <body>
    <div class="card">
      <div class="tv"></div>
      <div class="MainText">APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)</div>
      <div class="productCode">Product code: 195434</div>
      <section class="stars stars--4">
        <section class="stars__star"></section>
        <section class="stars__star"></section>
        <section class="stars__star"></section>
        <section class="stars__star"></section>
        <section class="stars__star"></section>
        <section class="Reviews">   Reviews: 5</section>
      </section>
      <section>
        <section class="Price">Price:</section>
        <section class="money">$2,199</section>
      </section>

      <button>BUY</button>
    </div>
  </body>
</html>
