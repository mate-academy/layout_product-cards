<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <article
      class="card"
      data-qa="card"
    >
      <div class="card__media">
        <img
          class="card__image"
          src="../src/images/imac.jpeg"
          alt="APPLE A1419 iMac 27 Retina 5K Monoblock (MNED2UA/A)"
        />
      </div>

      <div class="card__body">
        <h3 class="card__title">
          APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
        </h3>

        <div class="card__code">Product code: 195434</div>

        <div class="card__rating">
          <div
            class="stars stars--4"
            aria-hidden="true"
          >
            <div class="stars__star"></div>

            <div class="stars__star"></div>

            <div class="stars__star"></div>

            <div class="stars__star"></div>

            <div class="stars__star"></div>
          </div>

          <div class="card__reviews">
            <div class="card__reviews-count">Review: 5</div>
          </div>
        </div>

        <div class="card__price">
          <div class="card__price-current">Price:</div>

          <div class="card__price-old">$2,199</div>
        </div>

        <a
          class="card__buy"
          href="#"
          data-qa="hover"
        >
          Buy
        </a>
      </div>
    </article>
  </body>
</html>
