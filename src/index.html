<!doctype html>
<html
  lang="en"
  class="page"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./styles/main.scss"
    />
  </head>
  <body class="page__body">
    <article
      class="product-card"
      data-qa="card"
    >
      <a
        href="#apple-a1419-imac-27"
        class="product-card__image"
      >
        <img
          src="./images/imac.jpeg"
          alt="Picture of an Apple A1419 iMac 27 inches computer"
        />
      </a>

      <div class="product-card__content product">
        <h1 class="product__title">
          APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
        </h1>

        <p class="product__code">
          Product code:
          <span class="product__code-value">195434</span>
        </p>

        <div class="product__rating rating">
          <div class="rating__stars stars stars--4">
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
          </div>
          <div class="rating__reviews">
            Reviews:
            <span class="rating__review-value">5</span>
          </div>
        </div>

        <div class="product__price">
          <span class="product__price-label">Price:</span>
          <span class="product__price-value">$2,199</span>
        </div>

        <a
          href="#buy"
          class="product__button"
          data-qa="hover"
        >
          Buy
        </a>
      </div>
    </article>
  </body>
</html>
