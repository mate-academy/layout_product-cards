<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <body>
    <div
      class="card"
      data-qa="card"
    >
      <section class="card__image"></section>
      <section class="card__text">
        APPLE A1419 iMac 27" Retina
        <br />
        5K Monoblock (MNED2UA/A)
      </section>
      <section class="card__prCode">Product code: 195434</section>
      <section class="card__reviews">
        <div class="stars">
          <div class="stars__1">
            <div class="stars__star"></div>
          </div>
          <div class="stars__2">
            <div class="stars__star"></div>
          </div>
          <div class="stars__3">
            <div class="stars__star"></div>
          </div>
          <div class="stars__4">
            <div class="stars__star"></div>
          </div>
          <div class="stars__5">
            <div class="stars__star"></div>
          </div>
        </div>
        <div class="card__reviewText">Reviews: 5</div>
      </section>
      <section class="card__price">
        <div class="card__priceText">Price:</div>
        <div class="card__priceValue">$2,199</div>
      </section>
      <section class="card__link">
        <a
          href="#"
          data-qa="hover"
        >
          <button class="card__linkContent">Buy</button>
        </a>
      </section>
    </div>
  </body>
</html>
