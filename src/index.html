<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <body>
    <article
      class="card"
      data-qa="card"
    >
      <div class="card__image">
        <img
          src="./images/imac.jpeg"
          alt="APPLE A1419 iMac 27"
        />
      </div>
      <a
        href="#"
        class="card__title-link"
      >
        <h3 class="card__title">
          APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
        </h3>
      </a>

      <a
        href="#"
        class="card__code-link"
      >
        <p class="card__code">Product code: 195434</p>
      </a>

      <div class="card__rating">
        <div class="stars stars--4">
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
        </div>

        <div class="card__reviews">Reviews: 5</div>
      </div>

      <div class="card__footer">
        <div class="card__price-wrapper">
          <span class="card__price-label">Price:</span>
          <span class="card__price">$2,199</span>
        </div>

        <a
          href="#"
          class="card__button-link"
          data-qa="hover"
        >
          <button
            type="button"
            class="card__button"
          >
            BUY
          </button>
        </a>
      </div>
    </article>
  </body>
</html>
