<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div
      data-qa="card"
      class="card"
    >
      <img
        src="./images/imac.jpeg"
        alt="card image"
        class="card__img card__img--spacing"
      />

      <h4 class="card__title card__title--spacing">
        APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
      </h4>
      <p class="card__product-code card__product-code--spacing">
        Product code: 195434
      </p>

      <div class="card__review card__review--spacing review">
        <div class="review__stars stars stars--active">
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
        </div>
        <p class="review__count">Reviews: 5</p>
      </div>

      <div class="card__price price card__price--spacing">
        <p class="price__title">Price:</p>
        <h3 class="price__price">$2,199</h3>
      </div>

      <button class="card__btn btn">
        <a
          data-qa="hover"
          href="#"
          class="btn__link"
        >
          Buy
        </a>
      </button>
    </div>
  </body>
</html>
