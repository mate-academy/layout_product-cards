<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div
      data-qa="card"
      class="card card--position"
    >
      <div class="card__image card__image--position"></div>

      <div class="card__text-big">
        APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
      </div>
      <div class="card__code">Product code: 195434</div>

      <div class="stars">
        <div class="stars-review stars-review--4">
          <div class="stars-review__star"></div>
          <div class="stars-review__star"></div>
          <div class="stars-review__star"></div>
          <div class="stars-review__star"></div>
          <div class="stars-review__star"></div>
        </div>
        <div class="stars__reviews">Reviews: 5</div>
      </div>
      <div class="card__price card__price--position">
        <div class="card__price-text">Price:</div>
        <div class="card__price-dollar">$2,199</div>
      </div>

      <a
        href="#"
        class="card__button card__button--position"
        data-qa="hover"
      >
        <span class="card__button-text">Buy</span>
      </a>
    </div>
  </body>
</html>
