<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <!-- Підключення шрифту Roboto з Regular, Medium та Bold -->
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <body>
    <div
      class="card"
      data-qa="card"
    >
      <div class="card__item item-card">
        <a
          href="#"
          class="item-card__image"
        >
          <img
            src="./images/imac.jpeg"
            alt="Image"
          />
        </a>
        <div class="item-card__body">
          <div class="item-card__info">
            <div class="item-card__title">
              APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
            </div>
            <div class="item-card__code">Product code: 195434</div>
          </div>
          <div class="item-card__rating">
            <div class="item-card__stars stars stars--4">
              <div class="stars__star"></div>
              <div class="stars__star"></div>
              <div class="stars__star"></div>
              <div class="stars__star"></div>
              <div class="stars__star"></div>
            </div>
            <div class="item-card__value">Reviews: 5</div>
          </div>
          <div class="item-card__cost">
            <div class="item-card__text">Price:</div>
            <div class="item-card__price">$2,199</div>
          </div>
        </div>
        <a
          href="#"
          class="item-card__button"
          data-qa="hover"
        >
          Buy
        </a>
      </div>
    </div>
  </body>
</html>
