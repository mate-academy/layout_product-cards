<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>

    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <h1>Product cards</h1>

    <div
      class="card"
      data-qa="card"
    >
      <div class="card__image"></div>

      <div class="card__device-name">
        <h3>APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)</h3>
      </div>

      <div class="card__product-code">Product code: 195434</div>

      <div class="stars stars--4">
        <div class="stars__star"></div>
        <div class="stars__star"></div>
        <div class="stars__star"></div>
        <div class="stars__star"></div>
        <div class="stars__star"></div>

        <span class="stars__reviews">Reviews: 5</span>
      </div>

      <div class="card__price">
        <div class="card__price-label">Price:</div>

        <div class="card__price-value">$2,199</div>
      </div>

      <button
        class="card__buy"
        data-qa="hover"
      >
        Buy
      </button>
    </div>
  </body>
</html>
