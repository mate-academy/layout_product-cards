<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/main.scss"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main
      class="card"
      data-qa="card"
    >
      <img
        class="card__image"
        src="./images/imac.jpeg"
        alt="imac"
      />
      <p class="card__product-name">
        APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
      </p>
      <p class="card__product-code">Product code: 195434</p>
      <section class="card__review">
        <div class="card__review-stars">
          <div
            class="card__review-stars-item card__review-stars-item--active"
          ></div>
          <div
            class="card__review-stars-item card__review-stars-item--active"
          ></div>
          <div
            class="card__review-stars-item card__review-stars-item--active"
          ></div>
          <div
            class="card__review-stars-item card__review-stars-item--active"
          ></div>
          <div
            class="card__review-stars-item card__review-stars-item--disabled"
          ></div>
        </div>
        <div class="card__review-number">Reviews: 5</div>
      </section>
      <section class="card__price">
        <p class="card__price-item card__price-item--text">Price:</p>
        <p class="card__price-item card__price-item--number">$2,199</p>
      </section>
      <a
        class="card__button"
        data-qa="hover"
      >
        BUY
      </a>
    </main>
  </body>
</html>
