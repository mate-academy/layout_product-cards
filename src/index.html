<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <body>
    <div
      class="card"
      data-qa="card"
    >
      <div class="card__image"></div>
      <div class="card__body">
        <p class="card__description">
          APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
        </p>
        <div class="card__code">
          <span>Product code: 195434</span>
        </div>
        <div class="stars">
          <div class="stars__list">
            <span class="stars__item stars__item--active"></span>
            <span class="stars__item stars__item--active"></span>
            <span class="stars__item stars__item--active"></span>
            <span class="stars__item stars__item--active"></span>
            <span class="stars__item"></span>
          </div>
          <span class="stars__reviews">Reviews: 5</span>
        </div>
        <div class="card__price">
          <span class="card__price-text">Price:</span>
          <span class="card__price-value">$2,199</span>
        </div>
        <a
          href="#"
          class="card__btn"
          data-qa="hover"
        >
          Buy
        </a>
      </div>
    </div>
  </body>
</html>
