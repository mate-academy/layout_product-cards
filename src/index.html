<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="main">
      <div
        class="card"
        data-qa="card"
      >
        <img
          class="card__img"
          src="./images/imac.jpeg"
          alt="Product_image"
        />
        <div class="card__title">
          <p class="card__title-text">
            APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
          </p>
        </div>
        <div class="card__code">
          <p class="card__code-text">Product code: 195434</p>
        </div>
        <div class="card__rating">
          <div class="stars stars--4">
            <div class="stars__list">
              <div class="stars__item"></div>
              <div class="stars__item"></div>
              <div class="stars__item"></div>
              <div class="stars__item"></div>
              <div class="stars__item"></div>
            </div>
          </div>
          <p class="card__reviews">Reviews: 5</p>
        </div>
        <div class="card__price">
          <div class="card__price-label">
            <p class="card__price-label-text">Price:</p>
          </div>
          <div class="card__price-value">
            <p class="card__price-value-text">$2,199</p>
          </div>
        </div>
        <a
          href="#"
          class="card__button"
          data-qa="hover"
        >
          Buy
        </a>
      </div>
    </main>
  </body>
</html>
