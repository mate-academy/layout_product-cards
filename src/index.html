<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <body>
    <main class="page">
      <section class="products">
        <article
          class="card"
          data-qa="card"
        >
          <div class="card__image-wrap">
            <img
              class="card__image"
              src="./images/imac.jpeg"
              alt="APPLE A1419 iMac 27 Retina"
            />
          </div>

          <a
            class="card__title"
            href="#"
          >
            APPLE A1419 iMac 27&quot; Retina 5K Monoblock (MNED2UA/A)
          </a>

          <p class="card__code">
            Product code:
            <span class="card__code-value">195434</span>
          </p>

          <div class="card__meta">
            <div class="stars stars--4">
              <span
                class="stars__star"
                aria-hidden="true"
              ></span>
              <span
                class="stars__star"
                aria-hidden="true"
              ></span>
              <span
                class="stars__star"
                aria-hidden="true"
              ></span>
              <span
                class="stars__star"
                aria-hidden="true"
              ></span>
              <span
                class="stars__star"
                aria-hidden="true"
              ></span>
            </div>

            <a
              class="card__reviews"
              href="#"
            >
              Reviews: 5
            </a>
          </div>

          <div class="card__price">
            <span class="card__price-label">Price:</span>
            <span class="card__price-value">$2,199</span>
          </div>

          <a
            class="card__button"
            href="#"
            data-qa="hover"
          >
            BUY
          </a>
        </article>
      </section>
    </main>
  </body>
</html>
