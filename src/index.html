<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <body>
    <div class="card" data-qa="card">
      <div class="card__image-wrapper">
        <img
          class="card__image"
          src="./images/imac.jpeg"
          alt="APPLE A1419 iMac 27 Retina 5K Monoblock"
        />
      </div>

      <div class="card__info">
        <p class="card__title">
          APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
        </p>

        <p class="card__code">Product code: 195434</p>

        <div class="stars stars--4">
          <img
            class="stars__star"
            src="./images/star-active.svg"
            alt="star"
          />
          <img
            class="stars__star"
            src="./images/star-active.svg"
            alt="star"
          />
          <img
            class="stars__star"
            src="./images/star-active.svg"
            alt="star"
          />
          <img
            class="stars__star"
            src="./images/star-active.svg"
            alt="star"
          />
          <img
            class="stars__star"
            src="./images/star-active.svg"
            alt="star"
          />
          <span class="stars__reviews">Reviews: 5</span>
        </div>

        <div class="card__price-row">
          <span class="card__price-label">Price:</span>
          <span class="card__price">$2,199</span>
        </div>

        <a
          class="card__buy"
          href="#"
          data-qa="hover"
        >BUY</a>
      </div>
    </div>
  </body>
</html>
