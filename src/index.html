<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <body>
    <article
      class="card"
      data-qa="card"
    >
      <header class="card__top">
        <img
          src="./images/imac.jpeg"
          alt="imac"
          class="card__image"
        />
      </header>

      <div class="card__bottom">
        <div class="card__description">
          <div class="card__description-title">
            APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
          </div>
          <div class="card__description-code">Product code: 195434</div>
        </div>

        <div class="stars">
          <div class="stars__pictures">
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
          </div>

          <div class="stars__reviews">Reviews: 5</div>
        </div>

        <div class="card__price">
          <div class="card__price-caption">Price:</div>

          <div class="card__price-digits">$2,199</div>
        </div>

        <div class="card__buy">
          <a
            href="#"
            class="card__buy-link"
            data-qa="hover"
          >
            Buy
          </a>
        </div>
      </div>
    </article>
  </body>
</html>
