<!-- #region header -->
<!doctype html>
<html
  lang="en"
  class="page"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <!-- #region fonts -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap"
      rel="stylesheet"
    />
    <!-- #endregion -->
    <!-- #region styles -->
    <link
      rel="stylesheet"
      href="./styles/variables.scss"
    />
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
    <link
      rel="stylesheet"
      href="./styles/stars.scss"
    />
    <!-- #endregion -->
  </head>
  <!-- #endregion -->
  <body class="page__body">
    <main class="main">
      <div
        class="card"
        data-qa="card"
      >
        <img
          src="../src/images/imac.jpeg"
          alt="iMac preview image"
          class="card__image"
        />
        <h2 class="card__title">
          APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
        </h2>

        <p class="card__code">Product code: 195434</p>

        <div class="card__rating">
          <div class="stars stars--4 card__stars">
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
          </div>

          <span class="card__reviews">Reviews: 5</span>
        </div>

        <div class="card__info">
          <p class="card__info-price">Price:</p>
          <p class="card__info-cost">$2,199</p>
        </div>

        <button
          class="card__button"
          data-qa="hover"
        >
          <span class="card__button-text">Buy</span>
        </button>
      </div>
    </main>
  </body>
</html>
