<!-- #region head -->
<!doctype html>
<html
  lang="en"
  class="page"
>
  <head>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <!-- #endregion -->
  <body class="page__body">
    <div
      class="card"
      data-qa="card"
    >
      <img
        src="/src/images/imac.jpeg"
        class="card__image"
        alt="logo"
      />

      <div class="card__content card__content--describe">
        <div class="card__describe">
          APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
        </div>
      </div>
      <div class="card__product-code">Product code: 195434</div>
      <div class="card__content card__content--reviews">
        <div class="card__reviews">
          <div class="card__stars card__stars--4">
            <div class="card__star"></div>
            <div class="card__star"></div>
            <div class="card__star"></div>
            <div class="card__star"></div>
            <div class="card__star"></div>
          </div>

          <div class="card__reviews-text">Reviews: 5</div>
        </div>
      </div>
      <div class="card__content card__content--price">
        <div class="card__price">
          <div class="card__price-text">Price:</div>
          <div class="card__price-amounth">$2,199</div>
        </div>
      </div>
      <a
        href="#"
        class="card__button"
        data-qa="hover"
      >
        buy
      </a>
    </div>
  </body>
</html>
