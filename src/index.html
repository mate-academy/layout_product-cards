<!doctype html>
<html lang="en">
  <!-- #region head -->
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
    <link
      rel="stylesheet"
      href="./styles/index.css"
    />
  </head>
  <!-- #endregion -->
  <body>
    <div
      class="card"
      data-qa="card"
    >
      <div class="card__image"></div>

      <div class="card__body">
        <p class="card__title">
          <span class="card__title-line">APPLE A1419 iMac 27" Retina</span>
          <span class="card__title-line">5K Monoblock (MNED2UA/A)</span>
        </p>
        <p class="card__description">Product code: 195434</p>

        <div class="card__rating">
          <div class="card__rate card__rate--rating-4">
            <span class="card__star"></span>
            <span class="card__star"></span>
            <span class="card__star"></span>
            <span class="card__star"></span>
            <span class="card__star"></span>
          </div>
          <span class="card__review">Reviews: 5</span>
        </div>

        <div class="card__price">
          <span class="card__price-label">Price:</span>
          <span class="card__price-value">$2,199</span>
        </div>
      </div>

      <a
        href="#"
        class="card__buy"
        data-qa="hover"
      >
        Buy
      </a>
    </div>
  </body>
</html>
