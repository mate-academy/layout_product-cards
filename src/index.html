<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com"
    crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <body class="page">
    <div class="product-card" data-qa="card">
      <img src="images/imac.jpeg" alt="product image"
      class="product-card__img">
      <div class="product-card__details">
        <div class="product-card__name">
          APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
        </div>
        <div class="product-card__code">
          Product code: 195434
        </div>
        <div class="product-card__rating-and-reviews">
          <div class="product-card__stars stars stars--4">
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
          </div>
          <div class="product-card__reviews">
            Reviews: 5
          </div>
        </div>
        <div class="product-card__price">
          <div class="product-card__price-text">
            Price:
          </div>
          <div class="product-card__price-number">
            $2,199
          </div>
        </div>
        <button class="product-card__buy-button" data-qa="hover">
          Buy
        </button>
      </div>
    </div>
  </body>
</html>
