<!-- #region header -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <!-- #endregion -->
  <body>
    <article
      class="product-card"
      data-qa="card"
    >
      <div class="product-card__image-wrapper">
        <img
          class="product-card__image"
          src="./images/imac.jpeg"
          alt="APPLE A1419 iMac 27 Retina 5K Monoblock"
        />
      </div>

      <h3 class="product-card__title">
        <a
          class="product-card__title-link"
          href="#"
        >
          APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
        </a>
      </h3>

      <p class="product-card__code">Product code: 195434</p>

      <div class="product-card__rating">
        <div class="stars stars--4">
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
        </div>
        <span class="product-card__reviews">Reviews: 5</span>
      </div>

      <div class="product-card__price-row">
        <span class="product-card__price-label">Price:</span>
        <span class="product-card__price">$2,199</span>
      </div>

      <a
        class="product-card__button"
        href="#"
        data-qa="hover"
      >
        BUY
      </a>
    </article>
  </body>
</html>
