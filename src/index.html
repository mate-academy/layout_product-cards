<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <body>
    <div
      class="card"
      data-qa="card"
    >
      <img
        class="card__image"
        src="./images/imac.jpeg"
        alt="iMac"
      />

      <h3 class="card__title">
        APPLE A1419 iMac 27" Retina
        <br />
        5K Monoblock (MNED2UA/A)
      </h3>

      <p class="card__code">Product code: 195434</p>

      <div class="card__stars stars stars--4">
        <span class="stars__item"></span>
        <span class="stars__item"></span>
        <span class="stars__item"></span>
        <span class="stars__item"></span>
        <span class="stars__item"></span>
        <span class="stars__reviews">Reviews: 5</span>
      </div>

      <div class="card__priceBox">
        <span class="card__priceBox-label">Price:</span>
        <span class="card__priceBox-price">$2,199</span>
      </div>

      <a
        class="card__buy"
        href="#"
        data-qa="hover"
      >
        buy
      </a>
    </div>
  </body>
</html>
