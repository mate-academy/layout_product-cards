<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
    <link
      rel="stylesheet"
      href="styles/index.scss"
    />
    <link
      rel="stylesheet"
      href="styles/stars.scss"
    />
    <link
      rel="stylesheet"
      href="styles/cards.scss"
    />
    <link
      rel="stylesheet"
      href="styles/variables.scss"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div
      class="card"
      data-qa="card"
    >
      <img
        src="images/imac.jpeg"
        alt="Imac"
        class="card__img"
      />
      <h1 class="card__title">
        APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
      </h1>
      <h2 class="card__code">Product code: 195434</h2>
      <div class="card__textbox1">
        <div class="stars stars--4">
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
        </div>
        <h2 class="card__reviews">Reviews: 5</h2>
      </div>
      <div class="card__textbox2">
        <h1 class="card__priceText">Price:</h1>
        <h1 class="card__price">$2,199</h1>
      </div>
      <a
        href="/"
        class="card__buy-button"
        data-qa="hover"
      >
        buy
      </a>
    </div>

  </body>
</html>
