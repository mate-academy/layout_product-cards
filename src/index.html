<!doctype html>
<html
  lang="en"
  class="page"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <body class="page__content">
    <div
      class="product-card"
      data-qa="card"
    >
      <div class="product-card__img"></div>
      <h2 class="product-card__title">
        APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
      </h2>
      <div class="product-card__code">Product code: 195434</div>
      <div class="product-card__rating-area">
        <div class="stars stars--4">
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
        </div>
        <div class="product-card__reviews-amount">Reviews: 5</div>
      </div>
      <div class="product-card__price-area">
        <div class="product-card__price-title">Price:</div>
        <div class="product-card__price">$2,199</div>
      </div>
      <a
        data-qa="hover"
        href="#"
        class="product-card__button"
      >
        Buy
      </a>
    </div>
  </body>
</html>
