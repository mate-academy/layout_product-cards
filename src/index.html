<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="styles/index.scss"
    />
  </head>
  <body>
    <main class="main">
      <div
        class="card"
        data-qa="card"
      >
        <div class="card__top">
          <img
            src="images/imac.jpeg"
            alt="APPLE A1419 iMac 27 Retina 5K Monoblock (MNED2UA/A)"
            class="card__image"
          />
        </div>
        <div class="card__body">
          <h2 class="card__title">
            APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
          </h2>
          <p class="card__text">Product code: 195434</p>
          <div class="card__reviews">
            <ul class="card__stars stars stars--4">
              <li class="stars__star"></li>
              <li class="stars__star"></li>
              <li class="stars__star"></li>
              <li class="stars__star"></li>
              <li class="stars__star"></li>
            </ul>
            <span class="card__reviews-count">Reviews: 5</span>
          </div>
        </div>
        <div class="card__bottom">
          <div class="card__price-row">
            <span class="card__price-label">Price:</span>
            <span class="card__price-text">$2,199</span>
          </div>
          <a
            href="#"
            class="card__button"
            data-qa="hover"
          >
            Buy
          </a>
        </div>
      </div>
    </main>
  </body>
</html>
