<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="page">
    <article
      class="card"
      data-qa="card"
    >
      <div class="card__photo">
        <a href="#">
          <img
            src="images/imac.jpeg"
            alt="Apple iMac 27 Retina 5K"
            class="card__photo-img"
          />
        </a>
      </div>

      <div class="card__label">
        <h2 class="card__label-title">
          APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
        </h2>
        <p class="card__label-code">Product code: 195434</p>
      </div>

      <div class="card__reviews">
        <div class="card__reviews-star">
          <div class="stars stars--4">
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
            <div class="stars__star"></div>
          </div>
        </div>

        <div class="card__reviews-text">Reviews: 5</div>
      </div>

      <div class="card__price">
        <div class="card__price-label">Price:</div>

        <div class="card__price-value">$2,199</div>
      </div>

      <a
        href="#"
        class="card__button"
        data-qa="hover"
      >
        Buy
      </a>
    </article>
  </body>
</html>
