<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <body>
    <div
      class="product"
      data-qa="card"
    >
      <div class="product__image-container">
        <img
          class="product__image"
          src="images/imac.jpeg"
          alt="APPLE A1419 iMac 27 Retina 5K Monoblock (MNED2UA/A)"
        />
      </div>
      <div class="product__description">
        <h1 class="product__title">
          APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
        </h1>
        <h2 class="product__code">Product code: 195434</h2>
      </div>
      <div class="product__reviews">
        <div class="product__rating">
          <div class="product__star"></div>
          <div class="product__star"></div>
          <div class="product__star"></div>
          <div class="product__star"></div>
          <div class="product__star"></div>
        </div>
        <div class="product__reviews-count">Reviews: 5</div>
      </div>
      <div class="product__price">
        <div class="product__price-label">Price:</div>
        <div class="product__price-value">$2,199</div>
      </div>
      <div class="product__button">
        <a
          data-qa="hover"
          class="product__button-link"
          href="#"
        >
          Buy
        </a>
      </div>
    </div>
  </body>
</html>
