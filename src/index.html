<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./styles/index.scss">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <title>Product Card</title>
  </head>
  <body>
    <article class="card" data-qa="card">
      <a href="#" class="card__image-link">
        <img src="./images/imac.jpeg"
        alt="iMac"
        class="card__image">
      </a>

      <div class="card__content">
        <a href="#" class="card__title">Apple iPhone 13 128GB Midnight</a>

        <div class="stars stars--4">
          <div class="stars__item"></div>
          <div class="stars__item"></div>
          <div class="stars__item"></div>
          <div class="stars__item"></div>
          <div class="stars__item"></div>
        </div>

        <div class="card__footer">
          <span class="card__price">29 999 ₴</span>
          <a
          href="#"
          class="card__buy-button"
          data-qa="hover"
          >BUY</a>
        </div>
      </div>
    </article>
  </body>
</html>
