<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <body>
    <main>
      <div
        class="card"
        data-qa="card"
      >
        <img
          class="card__image"
          src="./images/imac.jpeg"
          alt="iMac"
        />

        <div class="card__name">
          APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
        </div>

        <div class="card__code">Product code: 195434</div>

        <div class="star">
          <div class="star__stars">
            <div class="star__stars-item"></div>
            <div class="star__stars-item"></div>
            <div class="star__stars-item"></div>
            <div class="star__stars-item"></div>
            <div class="star__stars-item"></div>
          </div>
          <p class="star__text">Reviews: 5</p>
        </div>

        <div class="card__price">
          <p class="card__price-tag">Price:</p>
          <p class="card__price-value">$2,199</p>
        </div>
        <button
          class="card__button"
          data-qa="hover"
        >
          buy
        </button>
      </div>
    </main>
  </body>
</html>
