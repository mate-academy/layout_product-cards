<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <article
      class="card-monitor"
      data-qa="card"
    >
      <img
        class="card-monitor__img"
        src="./images/imac.jpeg"
        alt="monitor APPLE"
      />
      <div class="card-monitor__info">
        <h3 class="card-monitor__title">
          APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
        </h3>
        <small class="card-monitor__code">Product code: 195434</small>
      </div>
      <div class="card-monitor__rating">
        <div class="stars stars--4 card-monitor__stars">
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
        </div>
        <div class="card-monitor__reviews">Reviews: 5</div>
      </div>
      <div class="card-monitor__prise-box">
        <div class="card-monitor__price-label">Price:</div>
        <div class="card-monitor__price-value">$2,199</div>
      </div>
      <button
        type="button"
        class="card-monitor__button"
        data-qa="hover"
      >
        Buy
      </button>
    </article>
  </body>
</html>
