<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <body>
    <article
      data-qa="card"
      class="card"
    >
      <a href="#">
        <img
          class="card__image"
          src="../src/images/imac.jpeg"
          alt="imac-product-picture"
        />
      </a>
      <h1 class="product-name">
        APPLE A1419 iMac 27" Retina
        <br />
        5K Monoblock (MNED2UA/A)
      </h1>
      <small class="product-code">Product code: 195434</small>

      <div class="product-rate">
        <span class="stars stars--5">
          <span class="stars__star"></span>
          <span class="stars__star"></span>
          <span class="stars__star"></span>
          <span class="stars__star"></span>
          <span class="stars__star"></span>
        </span>

        <span class="review-number">Reviews: 5</span>
      </div>

      <div class="product-price">
        <span class="price-text">Price:</span>
        <span class="price-number">$2,199</span>
      </div>

      <a
        href="#"
        data-qa="hover"
        class="button-to-buy"
      >
        BUY
      </a>
    </article>
  </body>
</html>
