<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div
      class="card"
      data-qa="card"
    >
      <div class="card__photo">
        <img
          src="images/imac.jpeg"
          alt="Apple_Imac"
          class="card__imac"
        />
      </div>
      <div class="card__productname">
        APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
      </div>
      <div class="card__productcode">Product code: 195434</div>
      <div class="card__rating">
        <div class="stars stars--4">
          <div class="stars__icon"></div>
          <div class="stars__icon"></div>
          <div class="stars__icon"></div>
          <div class="stars__icon"></div>
          <div class="stars__icon"></div>
        </div>
        <div class="card__reviews-text">Reviews: 5</div>
      </div>
      <div class="card__price">
        <div class="card__price-label">Price:</div>
        <div class="card__price-value">$2,199</div>
      </div>
      <a
        class="card__button"
        data-qa="hover"
        href="#"
      >
        buy
      </a>
    </div>
  </body>
</html>
