<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <body>
    <h1>Product cards</h1>
    <div
      class="card"
      data-qa="card"
    >
      <img
        src="images/imac.jpeg"
        alt="APPLE A1419 iMac 27 Retina 5K Monoblock"
        class="card__image"
      />
      <span class="card__title">
        APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
      </span>
      <p class="card__description">Product code: 195434</p>
      <div class="card__reviews">
        <div class="stars stars--4">
          <span class="stars__stars"></span>
          <span class="stars__stars"></span>
          <span class="stars__stars"></span>
          <span class="stars__stars"></span>
          <span class="stars__stars"></span>
        </div>
        <p class="card__reviews-count">Reviews: 5</p>
      </div>
      <div class="card__price">
        <p class="card__description-price">Price:</p>
        <p class="card__price-of-product">$2,199</p>
      </div>
      <a
        href="#"
        data-qa="hover"
        class="card__buy-link"
      >
        BUY
      </a>
    </div>
  </body>
</html>
