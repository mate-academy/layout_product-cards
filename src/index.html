<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Product cards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/index.scss"/>
  </head>
  <body>
    <!--Title-->
    <h1>Product cards</h1>
    <!--CARD-->
    <article class="card" data-qa="card">
      <!--image-->
      <div class="card__image">
        <img src="./images/imac.jpeg" alt="Product image"/>
      </div>
      <!--CARD content wrapper-->
      <div class="card__content">
        <!--CARD header-->
        <div class="card__header">
          <h3 class="card__title">APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)</h3>
          <span class="card__sku">Product code: 195434</span>
        </div>
        <!--CARD review block-->
        <div class="card__reviews reviews">
          <!--Stars block-->
          <div class="stars stars--4">
            <span class="stars__item"></span>
            <span class="stars__item"></span>
            <span class="stars__item"></span>
            <span class="stars__item"></span>
            <span class="stars__item"></span>
          </div>
          <!--Reviews count label-->
          <span class="reviews__count">Reviews: 5</span>
        </div>
        <!--Price block-->
        <div class="card__price price">
          <span class="price__label">Price:</span>
          <span class="price__value">$2,199</span>
        </div>
        <button class="card__button button" data-qa="hover">
          BUY
        </button>
      </div>

    </article>
  </body>
</html>
