<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>

  <body>
    <!-- <h1>Product cards</h1> -->

    <div
      data-qa="card"
      class="product-card"
    >
      <img
        src="./images/imac.jpeg"
        alt="APPLE A1419"
        class="product-card__image"
      />

      <h2 class="product-card__title">
        APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
      </h2>

      <div class="product-card__code">Product code: 195434</div>

      <div class="product-card__review-container">
        <div class="stars stars--4">
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
        </div>

        <div class="product-card__review-count">Reviews: 5</div>
      </div>

      <div class="product-card__price-container">
        <div class="product-card__price-label">Price:</div>

        <div class="product-card__price">$2,199</div>
      </div>

      <a
        href="#"
        class="product-card__buy"
        data-qa="hover"
      >
        <span class="product-card__buy-text">Buy</span>
      </a>
    </div>
  </body>
</html>
