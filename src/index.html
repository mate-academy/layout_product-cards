<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>

  <body>
    <div
      data-qa="card"
      class="card"
    >
      <img
        class="card_imac"
        src="./images/imac.jpeg"
        alt="imac"
      />
      <h2 class="card_title">
        APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
      </h2>
      <span class="card_code">Product code: 195434</span>
      <div class="card_block_stars">
        <div class="stars">
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
        </div>
        <span class="card_block_stars-reviews">Reviews: 5</span>
      </div>
      <div class="card_block_price">
        <span class="card_block_price-text">Price:</span>
        <span class="card_block_price-value">$2,199</span>
      </div>
      <a
        data-qa="hover"
        class="card_buy"
        href="index.html"
      >
        Buy
      </a>
    </div>
  </body>
</html>
<!-- crossorigin="true" -->
