<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product card</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header></header>

    <main class="main">
      <div class="container">
        <article
          class="card"
          data-qa="card"
        >
          <img
            src="images/imac.jpeg"
            alt="APPLE A1419 iMac 27 Retina 5K"
            class="card__image"
          />

          <h2 class="card__title">
            APPLE A1419 iMac 27" Retina
            <br />
            5K Monoblock (MNED2UA/A)
          </h2>

          <div class="card__info">
            <span class="card__code">Product code: 195434</span>
          </div>

          <div class="card__rating">
            <div class="stars stars--5">
              <span></span>
              <span></span>
              <span></span>
              <span></span>
              <span></span>
            </div>
            <span class="card__reviews">Reviews:5</span>
          </div>

          <div class="card__meta">
            <span class="card__price-label">Price:</span>
            <span class="card__price-value">$2,199</span>
          </div>

          <a
            href="#"
            class="card__buy"
            data-qa="hover"
          >
            BUY
          </a>
        </article>
      </div>
    </main>

    <footer></footer>
  </body>
</html>
