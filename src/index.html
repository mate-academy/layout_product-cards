<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div
      class="card"
      data-qa="card"
    >
      <div class="card__header">
        <img
          class="card__header-img"
          src="../src/images/imac.jpeg"
          alt="Product image"
        />
      </div>
      <div class="card__content">
        <h1 class="card__title">
          APPLE A1419 iMac 27" Retina&nbsp; 5K Monoblock (MNED2UA/A)
        </h1>
        <p class="card__descr">Product code: 195434</p>

        <div class="card__rating stars stars--4">
          <ul class="stars__list">
            <li class="stars__item"></li>
            <li class="stars__item"></li>
            <li class="stars__item"></li>
            <li class="stars__item"></li>
            <li class="stars__item"></li>
          </ul>
          <span>Reviews: 5</span>
        </div>

        <div class="card__price">
          <span class="card__price-text">Price:</span>
          <span class="card__price-value">$2,199</span>
        </div>

        <a
          href="#"
          class="card__button"
          data-qa="hover"
        >
          Buy
        </a>
      </div>
    </div>
  </body>
</html>
