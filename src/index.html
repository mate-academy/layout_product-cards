<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <body>
    <div
      class="cards"
      data-qa="card"
    >
      <div class="cards__image"></div>
      <div class="cards__body">
        <p class="cards__description">
          APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
        </p>
        <div class="cards__code">
          <span>Product code: 195434</span>
        </div>
        <div class="cards__stars">
          <div class="cards__stars-list">
            <span class="cards__star"></span>
            <span class="cards__star"></span>
            <span class="cards__star"></span>
            <span class="cards__star"></span>
            <span class="cards__star"></span>
          </div>
          <span class="cards__reviews">Reviews: 5</span>
        </div>
        <div class="cards__price">
          <span class="cards__price-text">Price:</span>
          <span class="cards__price-value">$2,199</span>
        </div>
        <a
          href="#"
          class="cards__btn"
          data-qa="hover"
        >
          Buy
        </a>
      </div>
    </div>
  </body>
</html>
