<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  </head>

  <body class="body">

    <div class="card" data-qa="card">

      <div class="card__container">

        <div class="card__container__items card__container__items--img">
        </div>

        <div class="card__container__items card__container__items--text">
          APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
        </div>

        <div class="card__container__items card__container__items--product">
          <p>Product code: 195434</p>
        </div>

        <div class="card__container__items card__container__items--reviews">

            <div class="stars">

              <div class="card__container__items__reviews--star"></div>
              <div class="card__container__items__reviews--star"></div>
              <div class="card__container__items__reviews--star"></div>
              <div class="card__container__items__reviews--star"></div>
              <div class="card__container__items__reviews--star"></div>

            </div>

            <div class="review--text">
              <p>Reviews: 5</p>
            </div>

        </div>

        <div class="card__container__items card__container__items--price">
            <p class="text">Price:</p>
            <p class="text price">$2,199</p>
        </div>

        <button class="button" data-qa="hover">buy</button>
      </div>

    </div>

  </body>
</html>
