<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <body>
    <h1>Product cards</h1>

    <ul class="cards">
      <li class="cards__item">
        <img
          class="cards__image"
          src="./images/imac.jpeg"
        >
        <div class="cards__title">iMac</div>
        <p class="cards__price">$1,299</p>
        <div class="cards__rating">
          <img src="./images/star-active.svg">
          <img src="./images/star-active.svg">
          <img src="./images/star-active.svg">
          <img src="./images/star.svg">
          <img src="./images/star.svg">
        </div>
      </li>
    </ul>
  </body>
</html>
