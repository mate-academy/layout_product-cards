<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    class="body"
    data-qa="card"
  >
    <img
      src="./images/imac.jpeg"
      alt="Apple a1914 iMac"
      class="img"
    />

    <h2 class="name">APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)</h2>

    <div class="code">Product code: 195434</div>

    <div class="stars-blok">
      <div class="stars-blok__stars">
        <div class="stars-blok__stars-star"></div>
        <div class="stars-blok__stars-star"></div>
        <div class="stars-blok__stars-star"></div>
        <div class="stars-blok__stars-star"></div>
        <div class="stars-blok__stars-star"></div>
      </div>
      <div class="stars-blok__text">Reviews: 5</div>
    </div>
    <p class="price">
      <span class="price__text">Price:</span>
      <span class="price__value">$2,199</span>
    </p>
    <a
      class="buttom"
      data-qa="hover"
      href="#"
    >
      BUY
    </a>
  </body>
</html>
