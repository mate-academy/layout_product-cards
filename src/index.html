<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <body>
    <h1>Product cards</h1>

    <div class="cards-container">
      <div
        class="card"
        data-qa="card"
      >
        <div class="card__image">
          <img
            src="./images/imac.jpeg"
            alt="iMac"
          />
        </div>
        <h2 class="card__title">Apple iMac 24"</h2>
        <div class="card__price">$1,299.00</div>
        <div class="card__rating">
          <div class="stars stars--4">
            <span class="stars__star"></span>
            <span class="stars__star"></span>
            <span class="stars__star"></span>
            <span class="stars__star"></span>
            <span class="stars__star"></span>
          </div>
          <span class="card__reviews">(128 reviews)</span>
        </div>
        <a
          href="#"
          class="card__buy"
          data-qa="hover"
        >
          BUY
        </a>
      </div>

      <div
        class="card"
        data-qa="card"
      >
        <div class="card__image">
          <img
            src="./images/imac.jpeg"
            alt="iMac"
          />
        </div>
        <h2 class="card__title">Apple iMac 27"</h2>
        <div class="card__price">$1,799.00</div>
        <div class="card__rating">
          <div class="stars stars--5">
            <span class="stars__star"></span>
            <span class="stars__star"></span>
            <span class="stars__star"></span>
            <span class="stars__star"></span>
            <span class="stars__star"></span>
          </div>
          <span class="card__reviews">(256 reviews)</span>
        </div>
        <a
          href="#"
          class="card__buy"
          data-qa="hover"
        >
          BUY
        </a>
      </div>

      <div
        class="card"
        data-qa="card"
      >
        <div class="card__image">
          <img
            src="./images/imac.jpeg"
            alt="iMac"
          />
        </div>
        <h2 class="card__title">Apple iMac Pro</h2>
        <div class="card__price">$4,999.00</div>
        <div class="card__rating">
          <div class="stars stars--3">
            <span class="stars__star"></span>
            <span class="stars__star"></span>
            <span class="stars__star"></span>
            <span class="stars__star"></span>
            <span class="stars__star"></span>
          </div>
          <span class="card__reviews">(89 reviews)</span>
        </div>
        <a
          href="#"
          class="card__buy"
          data-qa="hover"
        >
          BUY
        </a>
      </div>
    </div>
  </body>
</html>
