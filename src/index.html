<!doctype html>
<html lang="en">
  <!-- region head-->
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    />
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>
  <!-- endregion -->
  <body>
    <div
      class="product-card"
      data-qa="card"
    >
      <!--region poster-->
      <a
        href="#"
        class="product-card__poster"
      >
        <img
          src="../src/images/imac.jpeg"
          alt="imac"
          class="product-card__poster-img"
        />
      </a>
      <!--endregion-->

      <!--region title-->
      <h1 class="product-card__title">
        APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
      </h1>
      <!--endregion-->

      <!--region id-->
      <div class="product-card__id">Product code: 195434</div>
      <!--endregion-->

      <!--region rating-->
      <div class="product-card__rating">
        <div class="stars stars--4">
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
          <div class="stars__star"></div>
        </div>

        <p>Reviews: 5</p>
      </div>
      <!--endregion-->

      <!--region price-->
      <div class="product-card__price">
        <span class="product-card__price-label">Price:</span>
        <span class="product-card__price-value">$2,199</span>
      </div>
      <!--endregion-->

      <!--region button-->
      <a
        class="main-button"
        href="#"
        data-qa="hover"
      >
        buy
      </a>
      <!--endregion-->
    </div>
  </body>
</html>
