<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
  </head>

  <body>
    <div
      class="card"
      data-qa="card"
    >
      <div class="card__image"></div>
      <ul class="card__list">
        <li class="card__item">
          <h2 class="card__header">
            APPLE A1419 iMac 27" Retina 5K Monoblock (MNED2UA/A)
          </h2>
        </li>
        <li class="card__item card__item--code">Product code: 195434</li>
        <li class="card__item">
          <div class="card__stars">
            <span class="card__star"></span>
            <span class="card__star"></span>
            <span class="card__star"></span>
            <span class="card__star"></span>
            <span class="card__star"></span>
            <span class="card__review">Reviews: 5</span>
          </div>
        </li>
        <li class="card__item card__item--price">
          <span class="card__text">Price:</span>
          <span class="card__num">$2,199</span>
        </li>
        <li class="card__item">
          <a
            href="#"
            class="card__button"
            data-qa="hover"
          >
            BUY
          </a>
        </li>
      </ul>
    </div>
  </body>
</html>
