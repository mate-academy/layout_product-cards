<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Product cards</title>
    <link
      rel="stylesheet"
      href="./styles/index.scss"
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div
      class="card"
      data-qa="card"
    >
      <img
        class="card__image"
        src="./images/imac.jpeg"
        alt="iMac A1419"
      />

      <h1 class="card__title">
        APPLE A1419 iMac 27" Retina
        <br />
        5K Monoblock (MNED2UA/A)
      </h1>

      <div class="card__code">Product code: 195434</div>

      <div class="stars stars--4">
        <div class="stars__icons">
          <div class="stars__icon"></div>
          <div class="stars__icon"></div>
          <div class="stars__icon"></div>
          <div class="stars__icon"></div>
          <div class="stars__icon"></div>
        </div>

        <div class="stars__reviews">Reviews: 5</div>
      </div>

      <div class="card__cost">
        <div class="card__cost-title">Price:</div>

        <div class="card__cost-price">$2,199</div>
      </div>

      <a
        href="#"
        class="card__button"
        data-qa="hover"
      >
        BUY
      </a>
    </div>
  </body>
</html>
