<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product cards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/index.0f91eb73.css">
  </head>
  <body>
    <div class="card">
      <img class="img" src="/imac.7443e69f.jpeg" alt="iMac computer">

      <div class="product-code">Product code: 195434</div>

        <div class="rating__stars" role="img" aria-label="Rating: 4 out of 5 stars">

          <img class="rating__star" src="/star-active.6804c253.svg" alt="">
          <img class="rating__star" src="/star-active.6804c253.svg" alt="">
          <img class="rating__star" src="/star-active.6804c253.svg" alt="">
          <img class="rating__star" src="/star.c7aebee4.svg" alt="">
        </div>
        <span class="rating__reviews">Reviews: 5</span>
      </div>
      <div class="price">
        <span class="price__label">Price:</span>
        <span class="price__amount">$2,199</span>
      </div>
      <div class="button"> </div>
    </div>
  <script src="/layout_product-cards.73c09e2e.js"></script></body>
</html>
